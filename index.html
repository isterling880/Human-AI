<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatTJB - Human-Powered AI</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --secondary: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0 0 5px 0;
            font-size: 1.8rem;
            color: #60a5fa;
        }

        header p {
            margin: 0;
            color: var(--secondary);
            font-size: 0.95rem;
        }

        .container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            flex: 1;
        }

        .panel {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .panel-header {
            background-color: #111827;
            padding: 15px;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
        }

        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.4;
            font-size: 0.95rem;
        }

        .message.user {
            background-color: #2563eb;
            color: white;
            align-self: flex-end;
        }

        .message.bot {
            background-color: #334155;
            color: var(--text-color);
            align-self: flex-start;
        }

        .input-area {
            display: flex;
            padding: 12px;
            background-color: #111827;
            border-top: 1px solid var(--border-color);
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            color: var(--text-color);
            font-size: 0.95rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        /* Admin Queue Specific Styles */
        .queue-item {
            background-color: #111827;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .queue-item .question-text {
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .queue-actions {
            display: flex;
            gap: 8px;
        }

        .empty-queue {
            color: var(--secondary);
            text-align: center;
            margin-top: 40px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>ChatTJB Server</h1>
        <p>Real-time human-in-the-loop chat simulation powered by Flask</p>
    </header>

    <div class="container">
        <!-- USER PANEL -->
        <div class="panel">
            <div class="panel-header">
                <span>User Chat View</span>
            </div>
            <div class="chat-box" id="userChatBox">
                <div class="message bot">Hello! Type a message below. A real human will read and answer it soon.</div>
            </div>
            <div class="input-area">
                <input type="text" id="userMessageInput" placeholder="Ask something..." onkeypress="handleUserKeyPress(event)">
                <button onclick="sendUserMessage()">Send</button>
            </div>
        </div>

        <!-- ADMIN PANEL -->
        <div class="panel">
            <div class="panel-header">
                <span>Human Admin Inbox</span>
                <button onclick="fetchQueue()" style="padding: 4px 8px; font-size: 0.8rem;">Refresh</button>
            </div>
            <div class="chat-box" id="adminQueueBox">
                <div class="empty-queue">Loading queue...</div>
            </div>
        </div>
    </div>

    <script>
        // --- USER FUNCTIONS ---
        async function sendUserMessage() {
            const input = document.getElementById("userMessageInput");
            const text = input.value.trim();
            if (!text) return;

            // Append user message locally for instant feedback
            appendMessage(text, 'user');
            input.value = "";

            try {
                await fetch('/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                // Trigger an admin view refresh so the new message shows up instantly
                fetchQueue();
            } catch (error) {
                console.error("Error sending message:", error);
            }
        }

        function handleUserKeyPress(event) {
            if (event.key === 'Enter') {
                sendUserMessage();
            }
        }

        function appendMessage(text, sender) {
            const chatBox = document.getElementById("userChatBox");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${sender}`;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // --- ADMIN FUNCTIONS ---
        async function fetchQueue() {
            try {
                const response = await fetch('/admin/queue');
                const queue = await response.json();
                const queueBox = document.getElementById("adminQueueBox");
                queueBox.innerHTML = "";

                if (queue.length === 0) {
                    queueBox.innerHTML = '<div class="empty-queue">No pending messages in queue.</div>';
                    return;
                }

                queue.forEach((item, index) => {
                    const itemDiv = document.createElement("div");
                    itemDiv.className = "queue-item";
                    
                    let contentHTML = `<div class="question-text"><strong>User:</strong> ${item.user}</div>`;
                    
                    if (item.reply) {
                        contentHTML += `<div style="font-size: 0.85rem; color: #4ade80;"><strong>Replied:</strong> ${item.reply}</div>`;
                    } else {
                        contentHTML += `
                            <div class="queue-actions">
                                <input type="text" id="reply-${index}" placeholder="Type human reply..." onkeypress="handleAdminKeyPress(event, ${index})">
                                <button onclick="sendReply(${index})">Reply</button>
                            </div>
                        `;
                    }
                    
                    itemDiv.innerHTML = contentHTML;
                    queueBox.appendChild(itemDiv);
                });
            } catch (error) {
                console.error("Error fetching queue:", error);
            }
        }

        async function sendReply(index) {
            const replyInput = document.getElementById(`reply-${index}`);
            const replyText = replyInput.value.trim();
            if (!replyText) return;

            try {
                const response = await fetch('/admin/reply', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ index: index, reply: replyText })
                });
                
                const result = await response.json();
                if (result.status === "Success") {
                    // Show the reply in the user chat box as well
                    appendMessage(replyText, 'bot');
                    fetchQueue();
                }
            } catch (error) {
                console.error("Error sending reply:", error);
            }
        }

        function handleAdminKeyPress(event, index) {
            if (event.key === 'Enter') {
                sendReply(index);
            }
        }

        // Periodically poll the queue to update the admin view automatically
        setInterval(fetchQueue, 3000);

        // Initial load
        fetchQueue();
    </script>
</body>
</html>
